{% extends "base.html" %}
{% block content %}
<div class="container">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="{{ base_url }}">Home</a><span class="sep">/</span>
    <span class="current">{{ hub_title }}</span>
  </nav>
  <div class="page-head">
    <h1>{{ hub_title }}</h1>
    <p class="page-lede">{{ hub_intro }}</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <ul class="guide-grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));">
      {% for p in pages %}
      <li>
        <a class="guide-card" href="{{ base_url }}{{ hub_slug }}/{{ p.slug }}/">
          <div class="tag" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;margin-bottom:.5rem;">{{ p.tag }}</div>
          <strong>{{ p.h1 }}</strong>
          <span>{{ p.excerpt }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
