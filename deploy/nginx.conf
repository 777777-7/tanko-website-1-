# =============================================================================
# Primaxs Marketing (M) Sdn Bhd — nginx server block
# https://www.storagesystem.com.my
#
# PORTABILITY NOTE
# The live site is served by Cloudflare, which reads `docs/_headers` (generated
# by site/build.py). This block is the equivalent config for an nginx origin —
# use it only if the site is moved off Cloudflare. Point `root` at the built
# `docs/` directory.
# =============================================================================

# --- Apex -> www (301), matches live Cloudflare behaviour --------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name storagesystem.com.my;
    return 301 https://www.storagesystem.com.my$request_uri;
}

# --- HTTP -> HTTPS -----------------------------------------------------------
server {
    listen 80;
    server_name www.storagesystem.com.my;
    return 301 https://www.storagesystem.com.my$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.storagesystem.com.my;

    root /var/www/storagesystem/docs;
    index index.html;

    # ---------------------------------------------------------- compression
    # Brotli (requires ngx_brotli). Falls back to gzip when unavailable.
    brotli              on;
    brotli_comp_level   6;
    brotli_types        text/html text/plain text/css text/xml
                        application/javascript application/json
                        application/xml application/rss+xml image/svg+xml;

    gzip                on;
    gzip_vary           on;
    gzip_comp_level     6;
    gzip_min_length     256;
    gzip_proxied        any;
    gzip_types          text/plain text/css text/xml
                        application/javascript application/json
                        application/xml application/rss+xml image/svg+xml;

    # ------------------------------------------------------------- security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # -------------------------------------------------------- immutable assets
    # site.css / *.js carry a ?v= cache-buster; /asset3/ images are write-once.
    location ~* ^/(assets/(css|js)|asset3|asset_content)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --------------------------------------------------------------- HTML
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    # ------------------------------------------ trailing-slash canonicalisation
    # Directory-style URLs resolve to <path>/index.html; redirect the
    # slashless form so only one canonical URL is ever served.
    location / {
        if ($request_uri ~ ^([^.?]*[^/])(\?.*)?$) {
            return 301 $1/$2;
        }
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
